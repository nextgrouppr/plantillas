<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RE Master v5.5 - Menu</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="RE Master">
    <link rel="apple-touch-icon" href="icono.png">

    <style>
        :root {
            --bg: #000; --card: #111; --border: #222; --accent: #0070f3;
            --text: #eaeaea; --subtext: #888;
        }
        body { 
            background: var(--bg); 
            color: var(--text); 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            margin: 0; 
            padding: 20px; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .header { text-align: center; margin-bottom: 40px; }
        .header h1 { font-size: 28px; font-weight: 800; margin: 0; letter-spacing: -1px; }
        .header p { color: var(--subtext); font-size: 14px; margin-top: 5px; text-transform: uppercase; letter-spacing: 2px; }

        .menu-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            width: 100%;
            max-width: 400px;
        }

        .menu-card {
            background: var(--card);
            border: 1px solid var(--border);
            padding: 25px;
            border-radius: 20px;
            text-decoration: none;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 20px;
            transition: all 0.2s ease;
        }

        .menu-card:active {
            transform: scale(0.97);
            background: #1a1a1a;
            border-color: var(--accent);
        }

        .icon {
            font-size: 30px;
            width: 50px;
            height: 50px;
            background: #1a1a1a;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            border: 1px solid #333;
        }

        .info { display: flex; flex-direction: column; }
        .info b { font-size: 18px; font-weight: 700; }
        .info span { font-size: 12px; color: var(--subtext); margin-top: 2px; }

        .footer-logo {
            margin-top: 50px;
            font-size: 10px;
            color: #333;
            letter-spacing: 3px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>RE Master</h1>
        <p>Real Estate Suite v5.5</p>
    </div>

    <div class="menu-grid">
        <a href="rentas.html" class="menu-card">
            <div class="icon">💰</div>
            <div class="info">
                <b>Cash Flow & Rentas</b>
                <span>Análisis de ingresos pasivos</span>
            </div>
        </a>

        <a href="fix-and-flip.html" class="menu-card">
            <div class="icon">🔨</div>
            <div class="info">
                <b>Fix & Flip</b>
                <span>Compra, remodelación y venta</span>
            </div>
        </a>

        <a href="brrr.html" class="menu-card">
            <div class="icon">🔄</div>
            <div class="info">
                <b>Método BRRR</b>
                <span>Refinanciamiento y escala</span>
            </div>
        </a>

        <a href="hard-money-flip.html" class="menu-card">
            <div class="icon">🏦</div>
            <div class="info">
                <b>Hard Money Flip</b>
                <span>Cálculo con capital privado</span>
            </div>
        </a>
    </div>

    <div class="footer-logo">Rodriguez Rivera Rivera Master v5.5</div>

</body>
</html>
