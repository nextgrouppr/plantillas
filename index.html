<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RE Master v5.5 - Fix & Flip</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="RE Master">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg: #050505; --card: #111; --border: #222; --accent: #0070f3;
            --green: #00ff88; --red: #ff4d4d; --yellow: #ffcc00; --text: #eaeaea; --subtext: #888;
        }
        body { background: var(--bg); color: var(--text); font-family: -apple-system, sans-serif; margin: 0; padding: 15px; }
        
        /* Menú de Navegación */
        .nav-menu { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 20px; }
        .nav-btn { background: var(--card); color: var(--text); text-decoration: none; text-align: center; padding: 10px 2px; border-radius: 8px; font-size: 10px; font-weight: bold; border: 1px solid var(--border); text-transform: uppercase; }
        .nav-btn.active { border-color: var(--accent); background: #001a35; }

        .wrapper { display: flex; flex-direction: column; gap: 15px; }
        .sidebar, .main-content { display: flex; flex-direction: column; gap: 15px; }
        .section-title { font-size: 11px; color: var(--subtext); text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid var(--border); padding-bottom: 5px; margin-bottom: 10px; }
        
        .input-group { margin-bottom: 10px; }
        label { display: block; font-size: 10px; color: var(--subtext); margin-bottom: 4px; }
        input { width: 100%; background: #1a1a1a; border: 1px solid var(--border); border-radius: 6px; padding: 12px; color: #fff; font-size: 16px; box-sizing: border-box; }
        
        .dashboard-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
        .metric-card { background: var(--card); border: 1px solid var(--border); padding: 12px; border-radius: 10px; text-align: center; }
        .metric-label { font-size: 9px; color: var(--subtext); text-transform: uppercase; }
        .metric-val { font-size: 16px; font-weight: bold; display: block; margin-top: 4px; }

        .main-box { background: var(--card); border: 1px solid var(--border); padding: 15px; border-radius: 12px; }
        .row-flex { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 13px; }
        hr { border: 0; border-top: 1px solid var(--border); margin: 12px 0; }
        .chart-container { height: 160px; position: relative; }
        
        @media (min-width: 768px) { .wrapper { flex-direction: row; } .sidebar { width: 320px; } .main-content { flex: 1; } }
    </style>
</head>
<body>

<div class="nav-menu">
    <a href="index.html" class="nav-btn active">Fix & Flip</a>
    <a href="brrr.html" class="nav-btn">BRRR</a>
    <a href="hard-money-flip.html" class="nav-btn">Hard Money</a>
</div>

<div class="wrapper">
    <div class="sidebar">
        <span class="section-title">Análisis de Compra</span>
        <div class="input-group"><label>Precio de Compra ($)</label><input id="price" type="number" value="150000" oninput="calc()"></div>
        <div class="input-group"><label>Costo de Reparaciones ($)</label><input id="rehab" type="number" value="35000" oninput="calc()"></div>
        <div class="input-group"><label>Valor de Venta Final (ARV) ($)</label><input id="arv" type="number" value="250000" oninput="calc()" style="color:var(--green); border-color:var(--green);"></div>
        
        <span class="section-title">Costos Operativos</span>
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
            <div class="input-group"><label>Cierre Compra (%)</label><input id="close_buy" type="number" value="3" oninput="calc()"></div>
            <div class="input-group"><label>Cierre Venta (%)</label><input id="close_sell" type="number" value="6" oninput="calc()"></div>
        </div>
        <div class="input-group"><label>Holding Costs (Meses)</label><input id="months" type="number" value="6" oninput="calc()"></div>
    </div>

    <div class="main-content">
        <div class="dashboard-grid">
            <div class="metric-card"><span class="metric-label">Inversión</span><span id="m_total" class="metric-val">--</span></div>
            <div class="metric-card"><span class="metric-label">Ganancia</span><span id="m_profit" class="metric-val" style="color:var(--green)">--</span></div>
            <div class="metric-card"><span class="metric-label">ROI %</span><span id="m_roi" class="metric-val">--</span></div>
        </div>

        <div class="main-box">
            <span class="section-title">Resumen de Operación</span>
            <div class="row-flex"><span>(+) Valor de Venta (ARV):</span> <b id="r_arv">--</b></div>
            <div class="row-flex"><span>(-) Precio Compra:</span> <span id="r_price">--</span></div>
            <div class="row-flex"><span>(-) Reparaciones:</span> <span id="r_rehab">--</span></div>
            <div class="row-flex"><span>(-) Costos de Cierre:</span> <span id="r_closing">--</span></div>
            <hr>
            <div class="row-flex" style="font-size:1.2rem; font-weight:bold;"><span>GANANCIA NETA:</span> <span id="r_profit" style="color:var(--green)">--</span></div>
        </div>

        <div class="main-box">
            <span class="section-title">Distribución de Capital</span>
            <div class="chart-container"><canvas id="flipChart"></canvas></div>
        </div>
    </div>
</div>

<script>
let chart = null;
function v(id){ return parseFloat(document.getElementById(id).value)||0; }
function f(n){ return "$" + n.toLocaleString('en-US', {minimumFractionDigits:0, maximumFractionDigits:0}); }

function calc() {
    const arv = v("arv");
    const price = v("price");
    const rehab = v("rehab");
    const closeBuy = price * (v("close_buy")/100);
    const closeSell = arv * (v("close_sell")/100);
    const totalClosing = closeBuy + closeSell;
    
    const totalInvested = price + rehab + closeBuy;
    const profit = arv - price - rehab - totalClosing;
    const roi = totalInvested > 0 ? (profit / totalInvested) * 100 : 0;

    document.getElementById("m_total").innerText = f(totalInvested);
    document.getElementById("m_profit").innerText = f(profit);
    document.getElementById("m_roi").innerText = roi.toFixed(1) + "%";
    
    document.getElementById("r_arv").innerText = f(arv);
    document.getElementById("r_price").innerText = "-" + f(price);
    document.getElementById("r_rehab").innerText = "-" + f(rehab);
    document.getElementById("r_closing").innerText = "-" + f(totalClosing);
    document.getElementById("r_profit").innerText = f(profit);

    updateChart(price, rehab, totalClosing, profit);
}

function updateChart(p, r, c, pr) {
    const ctx = document.getElementById('flipChart').getContext('2d');
    if(chart) chart.destroy();
    chart = new Chart(ctx, {
        type: 'doughnut',
        data: {
            labels: ['Compra', 'Rehab', 'Cierre', 'Ganancia'],
            datasets: [{
                data: [p, r, c, pr > 0 ? pr : 0],
                backgroundColor: ['#0070f3', '#555', '#ffcc00', '#00ff88'],
                borderWidth: 0
            }]
        },
        options: { maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { color: '#888', font: { size: 10 } } } } }
    });
}
calc();
</script>
</body>
</html>
