<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RE Master v5.5 - Pro Financial Status</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="RE Master">
    <link rel="apple-touch-icon" href="icono.png">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg: #050505; --card: #111; --border: #222; --accent: #0070f3;
            --green: #00ff88; --red: #ff4d4d; --yellow: #ffcc00; --text: #eaeaea; --subtext: #888;
        }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', -apple-system, sans-serif; margin: 0; padding: 20px; font-size: 14px; }
        
        /* NUEVO: Estilos para el menú de navegación superior */
        .nav-menu {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            margin-bottom: 25px;
        }
        .nav-btn {
            background: var(--card);
            color: var(--text);
            text-decoration: none;
            text-align: center;
            padding: 12px 5px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: bold;
            border: 1px solid var(--border);
            text-transform: uppercase;
        }
        .nav-btn.active { border-color: var(--accent); background: #001a35; }
        .nav-btn:active { transform: scale(0.95); }

        /* Tus estilos originales se mantienen aquí */
        .wrapper { display: flex; flex-direction: column; gap: 20px; }
        .sidebar, .main-content { display: flex; flex-direction: column; gap: 20px; }
        .section-title { font-size: 12px; color: var(--subtext); text-transform: uppercase; letter-spacing: 1px; display: block; margin-bottom: 10px; border-bottom: 1px solid var(--border); padding-bottom: 5px; }
        .input-group { margin-bottom: 15px; }
        label { display: block; font-size: 11px; color: var(--subtext); margin-bottom: 5px; }
        input { width: 100%; background: #1a1a1a; border: 1px solid var(--border); border-radius: 6px; padding: 10px; color: #fff; font-size: 16px; box-sizing: border-box; }
        .metric-card { background: var(--card); border: 1px solid var(--border); padding: 15px; border-radius: 12px; display: flex; flex-direction: column; }
        .metric-label { font-size: 11px; color: var(--subtext); margin-bottom: 5px; }
        .metric-val { font-size: 20px; font-weight: bold; }
        .dashboard-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
        .main-box { background: var(--card); border: 1px solid var(--border); padding: 20px; border-radius: 12px; }
        .row-flex { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 13px; }
        .positive { color: var(--green); }
        .negative { color: var(--red); }
        hr { border: 0; border-top: 1px solid var(--border); margin: 15px 0; }
        .chart-container { height: 180px; position: relative; }
        @media (min-width: 768px) { .wrapper { flex-direction: row; } .sidebar { width: 300px; } .main-content { flex: 1; } }
    </style>
</head>
<body>

<div class="nav-menu">
    <a href="index.html" class="nav-btn active">Principal</a>
    <a href="brrr.html" class="nav-btn">BRRR</a>
    <a href="hard-money-flip.html" class="nav-btn">Hard Money</a>
</div>

<div class="wrapper">
    <div class="sidebar">
        <span class="section-title">Ingresos Brutos</span>
        <div class="input-group">
            <label>RENTA MENSUAL TOTAL ($)</label>
            <input id="grossIncome" type="number" value="2500" oninput="calc()" style="border-color: var(--green); color: var(--green); font-weight: bold;">
        </div>
        
        <span class="section-title">Costos de Adquisición</span>
        <div class="input-group"><label>Precio de Compra</label><input id="price" type="number" value="180000" oninput="calc()"></div>
        <div class="input-group"><label>Remodelación / Rehab</label><input id="rehab" type="number" value="20000" oninput="calc()"></div>
        
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
            <div class="input-group"><label>Pronto %</label><input id="down" type="number" value="20" oninput="calc()"></div>
            <div class="input-group"><label>Interés %</label><input id="rate" type="number" value="7.5" oninput="calc()"></div>
        </div>

        <span class="section-title">Gastos Fijos (Monthly)</span>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
            <div class="input-group"><label>Hazard</label><input id="hazard" type="number" value="100" oninput="calc()"></div>
            <div class="input-group"><label>CRIM</label><input id="crim" type="number" value="120" oninput="calc()"></div>
        </div>

        <span class="section-title">Reservas Operativas %</span>
        <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px;">
            <div class="input-group"><label>Vacancia</label><input id="vac_pct" type="number" value="5" oninput="calc()"></div>
            <div class="input-group"><label>Maint.</label><input id="maint_pct" type="number" value="5" oninput="calc()"></div>
            <div class="input-group"><label>Mgmt.</label><input id="mgmt_pct" type="number" value="10" oninput="calc()"></div>
        </div>
    </div>

    <div class="main-content">
        <div class="dashboard-grid">
            <div class="metric-card"><span class="metric-label">Inversión</span><span id="m_total_invest" class="metric-val" style="color:#fff">--</span></div>
            <div class="metric-card"><span class="metric-label">Cash Flow</span><span id="m_cf" class="metric-val">--</span></div>
            <div class="metric-card"><span class="metric-label">Recuperación</span><span id="m_recovery" class="metric-val">--</span></div>
        </div>

        <div class="main-box">
            <span class="section-title">Estado de Resultados</span>
            <div class="row-flex"><span>(+) Ingreso:</span> <b class="positive" id="r_gross">--</b></div>
            <div class="row-flex"><span class="negative">(-) Gastos/Reservas:</span> <span class="negative" id="r_opex">--</span></div>
            <div class="row-flex"><span class="negative">(-) Hipoteca:</span> <span class="negative" id="r_pi">--</span></div>
            <hr>
            <div class="row-flex" style="font-weight:bold; font-size:1.2rem;"><span>CASH FLOW NETO:</span> <span id="r_cf">--</span></div>
        </div>

        <div class="main-box">
            <span class="section-title">Gráfica de Gastos</span>
            <div class="chart-container">
                <canvas id="rentChart"></canvas>
            </div>
            <hr>
            <div class="row-flex"><span>ROI Anual (CoC):</span> <b id="r_coc" class="positive">--%</b></div>
        </div>
    </div>
</div>

<script>
// Mantén TODA tu lógica de JavaScript aquí abajo igual que la tenías
let chart = null;
function v(id){ return parseFloat(document.getElementById(id).value)||0; }
function f(n){ return "$" + n.toLocaleString('en-US', {minimumFractionDigits:0, maximumFractionDigits:0}); }

function calc() {
    const grossIncome = v("grossIncome");
    const price = v("price");
    const rehab = v("rehab");
    const downAmt = price * (v("down")/100);
    const loan = price - downAmt;
    const rate = (v("rate")/100)/12;
    const pi = loan > 0 ? (loan * rate * Math.pow(1+rate, 360)) / (Math.pow(1+rate, 360) - 1) : 0;
    
    const opex = (grossIncome * (v("vac_pct")+v("maint_pct")+v("mgmt_pct"))/100) + v("hazard") + v("crim");
    const cashFlow = grossIncome - opex - pi;
    const totalInvested = downAmt + rehab + (price * 0.04);
    const coc = totalInvested > 0 ? ((cashFlow * 12) / totalInvested) * 100 : 0;

    document.getElementById("m_total_invest").innerText = f(totalInvested);
    document.getElementById("m_cf").innerText = f(cashFlow);
    document.getElementById("r_gross").innerText = f(grossIncome);
    document.getElementById("r_opex").innerText = "-" + f(opex);
    document.getElementById("r_pi").innerText = "-" + f(pi);
    document.getElementById("r_cf").innerText = f(cashFlow);
    document.getElementById("r_coc").innerText = coc.toFixed(1) + "%";
    
    const rec = document.getElementById("m_recovery");
    rec.innerText = cashFlow > 0 ? ((totalInvested/(cashFlow*12)).toFixed(1) + " Años") : "∞";

    updateChart(pi, opex, cashFlow);
}

function updateChart(pi, opex, cf) {
    const ctx = document.getElementById('rentChart').getContext('2d');
    if(chart) chart.destroy();
    chart = new Chart(ctx, {
        type: 'doughnut',
        data: {
            labels: ['Banco', 'Gastos', 'Cash Flow'],
            datasets: [{
                data: [pi, opex, cf > 0 ? cf : 0],
                backgroundColor: ['#0070f3', '#555', '#00ff88'],
                borderWidth: 0
            }]
        },
        options: { maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { color: '#888' } } } }
    });
}
calc();
</script>
</body>
</html>
